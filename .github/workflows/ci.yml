name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: gitleaks
        run: |
          # GITLEAKS_VERSION source-of-truth lives in .devcontainer/compose.yml
          # (YAML, unquoted) under the workspace service's `args:` block. The
          # sed strips both the `KEY: ` prefix and any quoting / whitespace so
          # this works regardless of the YAML quoting style.
          GITLEAKS_VERSION=$(grep 'GITLEAKS_VERSION:' .devcontainer/compose.yml | head -1 | sed 's/.*: //;s/[" ]//g')
          if [ -z "$GITLEAKS_VERSION" ]; then echo "ERROR: GITLEAKS_VERSION not found in .devcontainer/compose.yml"; exit 1; fi
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O /tmp/gitleaks.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --log-opts="${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD"

      - run: pnpm turbo run lint typecheck test:unit build

    env:
      # Public values resolved from GH Variables (post-security-posture-cleanup):
      # SUPABASE_URL = http://127.0.0.1:54321 (CI local stack — fast-job doesn't dial,
      #   build just needs the env var present).
      # SUPABASE_ANON_KEY = published local-stack default JWT.
      # NEXT_PUBLIC_POSTHOG_KEY = public by NEXT_PUBLIC_* convention.
      # See /ak-new-project § Security Posture for the rationale.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # `changes:` — classifies the PR diff so docs-only PRs skip the ~8–10 min
  # slow-job. Always succeeds (~5s); should NOT be added to branch
  # protection (it's the gate, not the gated). When `runtime=false`, the
  # slow-job's `if:` short-circuits and GitHub reports `skipped` which the
  # branch-protection contract accepts as success. See
  # kit/docs/guide/conventions.md § Slow-Job Lifecycle § Skip-on-docs-only
  # filter for the full rationale.
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for `git diff base.sha...HEAD` (default depth-1 errors)
      - id: classify
        name: Classify diff (docs-only → runtime=false)
        run: |
          set -euo pipefail
          # Three-dot diff = merge-base diff (the changes the PR introduces).
          # Two-dot would diff against base's current tip and pick up unrelated commits.
          changed_files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" || true)
          # Empty diff → runtime=true (safer default — run slow-job rather than silently skip).
          if [ -z "$changed_files" ]; then
            echo "Empty diff; defaulting runtime=true"
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `*.md` (not `**/*.md`): bash `case` is pattern matching, not pathname
          # expansion — inside `case`, `*` already matches `/`, so `*.md` covers
          # both `CLAUDE.md` and `apps/web/README.md`. `shopt -s globstar` only
          # affects globbing for filename expansion, NOT `case` semantics.
          # `**/*.md` in `case` behaves like `*/*.md` and misses root-level
          # markdown. Lalista hit this regression on PR #63 (2026-05-12).
          # Do NOT "fix" this back to `**/*.md`.
          runtime=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              *.md) ;;
              specs/**) ;;
              PLAN.md) ;;
              BUILD-LOG.md) ;;
              TODOS.md) ;;
              .gstack/**) ;;
              .devshop/**) ;;
              *)
                runtime=true
                break
                ;;
            esac
          done <<< "$changed_files"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

  # Slow job — runs on PRs to main after fast passes, when changes.runtime=true.
  # Spins up the local Supabase stack and exercises:
  #  - schema/type drift via scripts/ci-type-drift.sh
  #  - rollback round-trip via scripts/ci-rollback-explain.sh
  #  - Playwright E2E (rls-isolation, magic-link, capture-flow) against `next start`
  #
  # `supabase_edge_runtime` startup-flake retry codified from lalista PR 26
  # (2026-04-26): the container occasionally fails first-time health-check on
  # GH-Actions runners; we probe the functions endpoint and retry once on
  # 502/timeout (~30s extra in the unhappy path; zero cost in the happy path).
  slow:
    runs-on: ubuntu-latest
    needs: [fast, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.runtime == 'true'
    timeout-minutes: 30
    env:
      # CI's slow-job uses the local Supabase stack — `supabase status -o env`
      # later in the job overwrites these with the actual just-spun-up values,
      # but seeding them up-front keeps any pre-supabase-start step (typecheck
      # via the helpers) honest about which stack it points at.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with deps
        run: pnpm --filter @home-os/web exec playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (with edge-runtime health-check retry)
        run: |
          set -e
          start_supabase() {
            supabase start --ignore-health-check
            # Probe functions endpoint at the rebound API port (54421 per
            # supabase/config.toml). 401/404 = service is up; 502 = edge-runtime
            # cold-start flake; we retry once on that.
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 \
                "http://127.0.0.1:54421/functions/v1/" 2>/dev/null || echo "000")
              if [ "$code" = "401" ] || [ "$code" = "404" ]; then
                echo "Edge runtime healthy (HTTP $code)"
                return 0
              fi
              echo "Edge runtime probe $i/10 returned HTTP $code; waiting..."
              sleep 3
            done
            echo "Edge runtime didn't pass health-check"
            return 1
          }
          if ! start_supabase; then
            echo "::warning::supabase_edge_runtime_* failed first health-check; restarting once"
            supabase stop || true
            start_supabase
          fi
          # Export the live local-stack URL + JWTs into the job env. `supabase
          # status -o env` emits unprefixed names (API_URL, ANON_KEY, ...) —
          # NOT the seeded SUPABASE_URL the comment author originally assumed
          # would be overwritten. So we also explicitly bridge to the
          # NEXT_PUBLIC_* names the app reads (apps/web/lib/supabase/{client,
          # server}.ts + middleware.ts via `process.env.NEXT_PUBLIC_SUPABASE_*`).
          # Without the bridge, `next build` bakes `undefined` into the bundle
          # and `next start` throws "Your project's URL and Key are required to
          # create a Supabase client!" on every request the Playwright specs
          # trigger.
          supabase status -o env >> "$GITHUB_ENV"
          SB_ENV=$(supabase status -o env)
          SB_URL=$(echo "$SB_ENV" | awk -F= '/^API_URL=/{gsub(/"/,"",$2); print $2}')
          SB_KEY=$(echo "$SB_ENV" | awk -F= '/^ANON_KEY=/{gsub(/"/,"",$2); print $2}')
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SB_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SB_KEY"
          } >> "$GITHUB_ENV"

      - name: Schema type-drift check
        run: bash scripts/ci-type-drift.sh

      - name: Migration rollback round-trip
        run: bash scripts/ci-rollback-explain.sh

      - name: Build web app for E2E
        run: pnpm turbo run build --filter=@home-os/web

      - name: Start next + run Playwright E2E
        run: |
          set -e
          # Boot next in the background; wait for the port to open before
          # invoking Playwright. The `nohup` + `&` shape keeps the process
          # alive after the script step ends (Playwright owns the foreground).
          (cd apps/web && nohup pnpm exec next start -p 3000 >/tmp/next.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null 2>&1; then
              echo "next ready on :3000"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3000/ -o /dev/null 2>&1; then
            echo "::error::next failed to start within 30s"
            cat /tmp/next.log
            exit 1
          fi
          pnpm --filter @home-os/web test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: apps/web/playwright-report
          retention-days: 7
